<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="232" viewBox="0 0 1040 232" fill="none" role="img">
  <rect width="1040" height="232" rx="16" fill="#ffffff" stroke="#d0d7de"/>
  <text x="30" y="36" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12" letter-spacing="2.5" fill="#59636e">WHAT IT STANDS ON</text>
  <rect x="30" y="56" width="230" height="152" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="48" y="106" font-family="Georgia,'Times New Roman',serif" font-size="38" font-weight="600" fill="#1f2328">yara-x<tspan font-size="16" fill="#59636e"> 0.11</tspan></text>
  <text x="48" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#3b4149">signature engine, pure Rust</text>
  <text x="48" y="172" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="10.5" fill="#59636e">embeds wasmtime, so the unit</text><text x="48" y="187" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="10.5" fill="#59636e">allows W+X memory</text>
  <rect x="280" y="56" width="230" height="152" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="298" y="106" font-family="Georgia,'Times New Roman',serif" font-size="38" font-weight="600" fill="#1f2328">nix<tspan font-size="16" fill="#59636e"> 0.29</tspan></text>
  <text x="298" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#3b4149">fanotify, signals, processes</text>
  <text x="298" y="172" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="10.5" fill="#59636e">the kernel side of the probes</text>
  <rect x="530" y="56" width="230" height="152" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="548" y="106" font-family="Georgia,'Times New Roman',serif" font-size="38" font-weight="600" fill="#1f2328">tokio<tspan font-size="16" fill="#59636e"> 1</tspan></text>
  <text x="548" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#3b4149">async runtime of the daemon</text>
  <text x="548" y="172" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="10.5" fill="#59636e">322 crates in Cargo.lock in</text><text x="548" y="187" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="10.5" fill="#59636e">total</text>
  <rect x="780" y="56" width="230" height="152" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="798" y="106" font-family="Georgia,'Times New Roman',serif" font-size="30" font-weight="600" fill="#1f2328">Tauri 2</text>
  <text x="798" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#3b4149">dashboard shell around React 19</text>
  <text x="798" y="172" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="10.5" fill="#59636e">AppImage of 95 MB, 139 MB of</text><text x="798" y="187" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="10.5" fill="#59636e">node_modules for dev</text>
</svg>