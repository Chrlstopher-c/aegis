[workspace]
resolver = "2"
members = [
    "crates/aegis-core",
    "crates/aegis-probes",
    "crates/aegis-detection",
    "crates/aegis-response",
    "crates/aegis-daemon",
]
# Le programme eBPF vit dans crates/aegis-probes-ebpf (cible bpfel-unknown-none,
# nightly + bpf-linker) et est exclu du workspace : il casserait `cargo build`
# global. aegis-probes (loader/fanotify, userspace) compile sur stable.
exclude = ["crates/aegis-probes-ebpf"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Aegis contributors"]
repository = "https://github.com/trinityUwU/aegis"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
ulid = "1"
nix = { version = "0.29", features = ["fanotify", "fs", "signal", "process"] }
libc = "0.2"
tokio-tungstenite = "0.24"
futures-util = "0.3"
