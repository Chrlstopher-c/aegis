[workspace]
resolver = "2"
members = [
    "crates/aegis-core",
    "crates/aegis-detection",
    "crates/aegis-response",
    "crates/aegis-daemon",
]
# aegis-probes est exclu du workspace par défaut : il compile sur la cible
# bpfel-unknown-none (nightly + bpf-linker) et casserait `cargo build` global.

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Aegis contributors"]
repository = "https://github.com/trinityUwU/aegis"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"
ulid = "1"
